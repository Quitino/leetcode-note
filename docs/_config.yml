title: LeetCode Notes
description: 算法题解笔记
baseurl: "/leetcode-note"
url: "https://fengbo6.github.io"

theme: just-the-docs

# 导航顺序
nav_sort: case_insensitive

# 搜索
search_enabled: true
search:
  heading_level: 2
  previews: 3

# 页脚
footer_content: "Copyright &copy; 2024 bFeng"

# 颜色主题
color_scheme: light

# 插件
plugins:
  - jekyll-seo-tag

# 排除非页面文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
